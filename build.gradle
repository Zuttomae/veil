plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'net.fabricmc.fabric-loom'
    id 'maven-publish'
}

sourceSets {
    testmod {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

repositories {
    maven { url 'https://maven.nucleoid.xyz' }
}

dependencies {
    minecraft "com.mojang:minecraft:$minecraft_version"
    implementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    implementation "eu.pb4:polymer-virtual-entity:$polymer_version"
}

processResources {
    filesMatching('fabric.mod.json') {
        expand project.properties
    }
}

processTestmodResources {
    filesMatching('fabric.mod.json') {
        expand project.properties
    }
}

java {
    withSourcesJar()
    withJavadocJar()

    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

kotlin {
    explicitApi()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            name = "biryeong"
            url = uri("https://repo.biryeong.kim/releases/")

            credentials {
                username = System.getenv("BIRYEONG_REPO_USERNAME")
                password = System.getenv("BIRYEONG_REPO_PASSWORD")
            }
        }
    }
}